services:
  - type: web
    name: fastmail-mcp
    runtime: docker
    plan: free
    branch: deploy-koyeb
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Multi-account configuration, one gateway per entry:
      #   [{"label":"adrien","proxyToken":"<hex>","apiToken":"<jmap>"}, ...]
      # When unset, falls back to the single-account secrets below.
      - key: FASTMAIL_ACCOUNTS
        sync: false
      - key: PROXY_TOKEN
        sync: false
      - key: FASTMAIL_API_TOKEN
        sync: false
      # Opt-in: one child process per MCP session instead of one per request
      # - key: STATEFUL
      #   value: "1"
      # Optional safety net for the first deployments
      # - key: FASTMAIL_READ_ONLY
      #   value: "1"
      # - key: FASTMAIL_BULK_CONFIRM_THRESHOLD
      #   value: "25"
