services:
  - type: web
    name: fastmail-mcp
    runtime: docker
    plan: free
    branch: deploy-koyeb
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: FASTMAIL_API_TOKEN
        sync: false
      - key: PROXY_TOKEN
        sync: false
      # Second Fastmail account (gateway B): enable BOTH secrets to activate
      - key: FASTMAIL_API_TOKEN_WIFE
        sync: false
      - key: PROXY_TOKEN_WIFE
        sync: false
      # Opt-in: one child process per MCP session instead of one per request
      # - key: STATEFUL
      #   value: "1"
      # Optional safety net for the first deployments
      # - key: FASTMAIL_READ_ONLY
      #   value: "1"
      # - key: FASTMAIL_BULK_CONFIRM_THRESHOLD
      #   value: "25"
